# 河北工业大学本科报考咨询 — Docker Compose 服务编排
# v2：MySQL（偏好与持久账本）+ Redis（短期协调）+ ChromaDB（知识向量）

name: hellohebut-v2

services:

  # MySQL 8.4 LTS, independent v2 volume. The retired PG volume is not deleted.
  mysql:
    image: ${V2_MYSQL_IMAGE:-mysql:8.4}
    container_name: hellohebut-v2-mysql
    environment:
      - MYSQL_DATABASE=hellohebut
      - MYSQL_USER=hellohebut
      - MYSQL_PASSWORD=${V2_MYSQL_PASSWORD:-hellohebut123}
      - MYSQL_ROOT_PASSWORD=${V2_MYSQL_ROOT_PASSWORD:-hellohebut-root-local}
    ports:
      - "127.0.0.1:${V2_MYSQL_PORT:-15433}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_bin"]
    restart: unless-stopped
    networks:
      - hellohebut-network
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u $$MYSQL_USER -D $$MYSQL_DATABASE -Nse 'SELECT 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  # ── Redis 缓存（工作记忆）────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: hellohebut-v2-redis
    ports:
      - "${V2_REDIS_PORT:-16379}:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-hellohebut123}
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - hellohebut-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-hellohebut123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── ChromaDB 向量数据库（情景记忆 + 用户画像）────────────────────────────────
  chromadb:
    image: chromadb/chroma:0.5.23
    container_name: hellohebut-v2-chromadb
    ports:
      - "${V2_CHROMA_PORT:-18001}:8000"
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
      - ANONYMIZED_TELEMETRY=FALSE
    volumes:
      - chromadb-data:/chroma/chroma
    restart: unless-stopped
    networks:
      - hellohebut-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/api/v1/heartbeat || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ── Prometheus 监控 ─────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: hellohebut-v2-prometheus
    ports:
      - "${V2_PROMETHEUS_PORT:-19090}:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped
    networks:
      - hellohebut-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ── 本科报考咨询主应用 ───────────────────────────────────────────────────────
  hellohebut:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: hellohebut-v2-app
    ports:
      - "${V2_API_PORT:-18000}:8000"
    env_file:
      - .env
    environment:
      # 容器内固定值，覆盖 .env 中的本地路径
      - REDIS_URL=redis://:${REDIS_PASSWORD:-hellohebut123}@redis:6379/0
      - CHROMA_PERSIST_DIRECTORY=/app/data/chroma
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - V2_EVAL_BASELINE_PATH=/app/experiments/v2/reports/live/baseline.json
      - V2_TRACE_DIR=/app/experiments/v2/traces/chat
      - HELLOHEBUT_SKILLS_DIR=/app/skills
      - V2_KNOWLEDGE_COLLECTION=${V2_KNOWLEDGE_COLLECTION:-hello_hebut_v2}
      - KNOWLEDGE_SEED_DIR=/app/data/demo_docs
      - ADMISSION_DATA_PATH=/app/data/hebut_admission.csv
      - HELLOHEBUT_VERIFIED_MEMORY=${HELLOHEBUT_VERIFIED_MEMORY:-true}
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=hellohebut
      - MYSQL_USER=hellohebut
      - MYSQL_PASSWORD=${V2_MYSQL_PASSWORD:-hellohebut123}
    volumes:
      - ./experiments/v2/tmp/chroma:/app/data/chroma
      - ./data/demo_docs:/app/data/demo_docs:ro
      - ./data/hebut_admission.csv:/app/data/hebut_admission.csv:ro
      - ./experiments/v2/reports/live:/app/experiments/v2/reports/live
      - ./experiments/v2/traces:/app/experiments/v2/traces
      - ./skills:/app/skills
      - ./experiments/v2/tmp/logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - hellohebut-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  # ── 前端界面 + Nginx 反向代理 ────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    container_name: hellohebut-v2-frontend
    ports:
      - "${V2_FRONTEND_PORT:-8088}:80"
    volumes:
      - nginx-logs:/var/log/nginx
    depends_on:
      hellohebut:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - hellohebut-network
    healthcheck:
      # Alpine wget 会把 localhost 优先解析到 ::1，而 Nginx 当前仅监听 IPv4。
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

# ── 网络 ────────────────────────────────────────────────────────────────────
networks:
  hellohebut-network:
    driver: bridge

# ── 数据卷 ──────────────────────────────────────────────────────────────────
volumes:
  mysql-data:
  # Retained only for optional manual inspection/migration of the retired deployment.
  postgres-data:
  redis-data:
  chromadb-data:
  prometheus-data:
  nginx-logs:
